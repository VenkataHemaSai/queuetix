<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585 250" role="img" aria-labelledby="title desc"><title id="title">F3 admissions by elapsed minute</title><desc id="desc">Counts of newly admitted users per minute of wall time, in order: 0, 0, 120, 130. The last minute is partial.</desc><rect width="585" height="250" fill="#f8f7f3"/><g fill="#1d2524" font-family="system-ui, sans-serif" font-size="15"><text x="18" y="30" font-size="21" font-weight="bold">F3 admissions by elapsed minute</text><text x="18" y="53">Local service run · recorded passes · last interval partial</text><text x="18" y="87">0–60 s</text><rect x="125" y="72" width="0" height="20" fill="#145c52"/><text x="135" y="87">0</text>
<text x="18" y="129">60–120 s</text><rect x="125" y="114" width="0" height="20" fill="#145c52"/><text x="135" y="129">0</text>
<text x="18" y="171">120–180 s</text><rect x="125" y="156" width="360" height="20" fill="#145c52"/><text x="495" y="171">120</text>
<text x="18" y="213">180–240 s</text><rect x="125" y="198" width="390" height="20" fill="#145c52"/><text x="525" y="213">130</text></g></svg>
